name: Daily GMP digest

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC = 10:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print digests without sending"
        type: boolean
        default: false

concurrency:
  group: daily-notify
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the gate below lists this workflow's own runs

jobs:
  # GitHub's own schedule can start hours late, so an exact-time trigger
  # (db/exact_schedule.sql) starts this workflow by workflow_dispatch. The
  # schedule above stays as a fallback and stands down if that already ran today.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          done_today=0
          if [ "$EVENT" = "schedule" ]; then
            done_today=$(gh api "repos/$REPO/actions/workflows/daily_notify.yml/runs?event=workflow_dispatch&created=>=$(date -u +%F)" \
              -q '[.workflow_runs[] | select(.conclusion != "failure" and .conclusion != "cancelled")] | length' || echo 0)
          fi
          if [ "$done_today" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice title=Fallback not needed::Already started by the exact-time trigger today."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: notify/requirements.txt

      - run: pip install -r notify/requirements.txt

      - name: Send digest
        env:
          # Separate least-privilege connection (db/roles.sql) if set, else the shared one.
          DATABASE_URL: ${{ secrets.NOTIFY_DATABASE_URL || secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning title=Not configured::DATABASE_URL / FIREBASE_SERVICE_ACCOUNT_JSON secrets are not set; skipping (see README > Deploy)."
            exit 0
          fi
          python notify/send_digest.py ${{ inputs.dry_run && '--dry-run' || '' }}
